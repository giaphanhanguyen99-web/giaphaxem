<meta name="theme-color" content="#2f6b5a">
<style>
:root{--bg:#eef0ea;--surface:#fbfbf8;--ink:#1d2b2a;--muted:#5d6b69;--line:#bcc6bd;--accent:#2f6b5a;--accent-ink:#fff;--nam:#3e6a8f;--nu:#a8505f;--danger:#a8322f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b1a;--surface:#1c2625;--ink:#e6ece9;--muted:#9aa9a5;--line:#3a4846;--accent:#6bb89f;--accent-ink:#0f1a17;--nam:#79a6cc;--nu:#d98a98;--danger:#e57d79;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141b1a;--surface:#1c2625;--ink:#e6ece9;--muted:#9aa9a5;--line:#3a4846;--accent:#6bb89f;--accent-ink:#0f1a17;--nam:#79a6cc;--nu:#d98a98;--danger:#e57d79;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2{font-family:"Noto Serif",Georgia,"Times New Roman",serif;font-weight:600;margin:0}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:end;justify-content:space-between;margin-bottom:16px}
h1{font-size:2rem;line-height:1.1}
#count{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button,input,select,textarea{font:inherit;color:inherit}
button{padding:8px 14px;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer}
button:hover{border-color:var(--accent)}
.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.danger{color:var(--danger);border-color:var(--danger)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
#q{margin-bottom:12px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
:root{--th:150px;--cg:18px;--pw:136px}
.tree{display:flex;overflow-x:auto;padding:2px 0 12px}
.gls{position:sticky;left:0;z-index:2;flex:none;padding-right:12px;background:var(--bg)}
.gls b{display:flex;align-items:center;height:var(--th);margin-bottom:calc(var(--cg)*2);font-size:.7rem;font-weight:600;letter-spacing:.08em;color:var(--muted);white-space:nowrap}
.tr,.tr ul{list-style:none;margin:0;padding:0;display:flex;justify-content:center}
.tree>.tr{flex:none;margin:0 auto}
.tr ul{position:relative;padding-top:var(--cg)}
.tr ul::before{content:"";position:absolute;top:0;left:50%;height:var(--cg);margin-left:-1px;border-left:2px solid var(--line)}
.tr li{position:relative;flex:none;display:flex;flex-direction:column;align-items:center;padding:var(--cg) 8px 0}
.tr>li{padding-top:0}
.seg{display:inline-flex;max-width:100%;margin:0 0 12px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;border-radius:0;background:none;padding:8px 14px;font-size:.9rem}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tree.vt{display:block}
.vt ul{list-style:none;margin:0;padding:0 0 0 26px}
.vt>ul{padding-left:0}
.vt li{position:relative;padding:5px 0 5px 20px}
.vt li::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:1px solid var(--line)}
.vt li::after{content:"";position:absolute;left:0;top:27px;width:14px;border-top:1px solid var(--line)}
.vt li:last-child::before{bottom:auto;height:27px}
.vt>ul>li{padding-left:0;margin-bottom:8px}
.vt>ul>li::before,.vt>ul>li::after{display:none}
.vn{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vt .ring{width:14px;height:14px;border:2px solid var(--line);border-radius:50%;flex:none}
.vt .person{width:auto;height:auto;min-width:150px;flex-direction:row;align-items:center;gap:10px;padding:6px 12px;border:1px solid var(--line);border-left:4px solid var(--c,var(--line));border-radius:6px;background:var(--surface);text-align:left;line-height:1.35}
.vt .person+.person{border-left:4px solid var(--c,var(--line))}
.vt .person .t{display:flex;flex-direction:column;align-items:flex-start;color:var(--ink);font-size:1rem}
.vt .person .t span,.vt .person .t em{font-size:.8rem;color:var(--muted);font-style:normal}
.vt .person .av{width:60px;height:80px;border:1px solid var(--line);border-radius:4px}
.tr li::before,.tr li::after{content:"";position:absolute;top:0;height:var(--cg);border-top:2px solid var(--line)}
.tr li{--o:0px}
.tr li.m{--o:calc(var(--pw)*-.5)}
.tr li::before{right:calc(50% - var(--o));width:calc(50% + var(--o) + 1px);margin-right:-1px}
.tr li::after{left:calc(50% + var(--o));width:calc(50% - var(--o) + 1px);margin-left:-1px;border-left:2px solid var(--line)}
.tr li:first-child::before,.tr li:last-child::after{border:0}
.tr li:last-child::before{border-right:2px solid var(--line)}
.tr li:only-child::before{display:none}
.tr li:only-child::after{border:0;border-left:2px solid var(--line)}
.tr li.m:only-child::before{display:block;right:auto;left:calc(50% + var(--o));margin:0 0 0 -1px;width:calc(var(--o)*-1 + 2px);border:0;border-top:2px solid var(--line)}
.tr>li::before,.tr>li::after{display:none}
.node{display:flex;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.person{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;width:var(--pw);height:calc(var(--th) - 2px);padding:9px 8px;border:0;border-radius:0;background:none;text-align:center;line-height:1.25}
.person:hover{background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.person+.person{border-left:1px solid var(--line)}
.person:focus-visible{outline-offset:-3px}
.node:hover{border-color:var(--accent)}
.person.nam,.bi.nam{--c:var(--nam)}
.person.nu,.bi.nu{--c:var(--nu)}
.lt{display:flex;align-items:center;justify-content:center;flex:none;width:42px;height:56px;border:2px solid var(--c);border-radius:5px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--surface));font:700 1.35rem/1 "Be Vietnam Pro",system-ui,sans-serif}
.person .av{width:42px;height:56px;border:2px solid var(--c)}
.nm{display:flex;align-items:center;justify-content:center;height:3.6em;overflow:hidden;line-height:1.2;font-size:.78rem;font-weight:600}
.nm.sm{font-size:.7rem}
.dt{font-size:.74rem;color:var(--muted)}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;margin-bottom:6px;text-align:left}
.row span{color:var(--muted);font-size:.85rem}
.row .r{text-align:right}
.empty{padding:40px 8px;max-width:520px}
.empty h2{font-size:1.4rem;margin-bottom:8px}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:20px;width:min(560px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{font-size:1.35rem}
.sub{margin:2px 0 12px;color:var(--muted)}
dl{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin:0 0 16px}
dt{color:var(--muted);font-size:.9rem}
dd{margin:0}
a{color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:8px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 12px;margin:14px 0}
.grid label{display:flex;flex-direction:column;gap:3px;font-size:.88rem;color:var(--muted)}
.grid .w{grid-column:1/-1}
.err{color:var(--danger);min-height:1.4em;margin:0 0 8px}
textarea{min-height:140px;font-size:.8rem}
@media (max-width:520px){.grid{grid-template-columns:minmax(0,1fr)}dl{grid-template-columns:90px 1fr}}
#today{margin:0;color:var(--muted);font-size:.9rem}
.ph{display:none}
.av{width:60px;height:80px;border-radius:4px;object-fit:cover;object-position:center 20%;flex:none;background:var(--line);border:1px solid var(--line)}
.big{float:right;width:150px;height:200px;object-fit:cover;object-position:center 20%;border-radius:4px;margin:0 0 10px 14px;border:1px solid var(--line);cursor:zoom-in}
#dz{width:auto;max-width:94vw;padding:10px}
#dz img{display:block;max-width:100%;max-height:82vh;border-radius:4px}
@media (max-width:520px){.big{width:112px;height:150px}}
.pr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pr .av{width:90px;height:120px}
.pr input{width:auto;flex:1;min-width:0}
.vw{display:none}
html[data-mode="view"] .vw{display:inline-block}
html[data-mode="view"] .pa{display:none}
html[data-mode="view"] .gls{display:none}
.grid [hidden],.sug[hidden]{display:none!important}
.grid label{position:relative}
.rg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 12px}
.sug{position:absolute;left:0;right:0;top:100%;z-index:6;display:block;max-height:230px;overflow:auto;margin-top:2px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.sug button{display:flex;align-items:baseline;gap:8px;width:100%;min-height:42px;padding:8px 10px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;text-align:left;color:var(--ink);font-size:.95rem}
.sug button:last-child{border-bottom:0}
.sug button.on,.sug button:hover{background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.sug b{font-weight:600}
.sug small{color:var(--muted);font-size:.78rem}
.sug i{margin-left:auto;flex:none;font-style:normal;font-size:.8rem;color:var(--muted);white-space:nowrap}
.hint{font-size:.76rem;line-height:1.3;color:var(--muted)}
@media (max-width:520px){.rg{grid-template-columns:minmax(0,1fr)}.tabs button{font-size:.88rem}}
.row.gr{grid-template-columns:auto 1fr auto;align-items:center}
.gr .lt,.gr .av{grid-row:1/span 3;align-self:center;width:48px;height:64px}
.gr .lt{color:var(--c);font:700 1.35rem/1 "Be Vietnam Pro",system-ui,sans-serif}
.gr .av{border:2px solid var(--c)}
.gr.nam{--c:var(--nam)}
.gr.nu{--c:var(--nu)}
.gr .f{grid-column:2/-1}
@media (max-width:520px){.tabs button{flex:1;padding:8px 6px}h1{font-size:1.7rem}}
.bn{margin-bottom:14px;padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;background:var(--surface)}
.bn h2{margin-bottom:8px;font-size:1.05rem}
.bn h2 small{font:400 .8rem "Be Vietnam Pro",system-ui,sans-serif;color:var(--muted)}
.bl{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px}
.bi{flex:none;display:flex;align-items:center;gap:12px;min-width:260px;padding:8px 12px;text-align:left;background:var(--bg)}
.bi .lt,.bi .av{width:48px;height:64px}
.bi .av{border:2px solid var(--c)}
.bi .t{display:flex;flex-direction:column;align-items:flex-start;gap:1px;line-height:1.35}
.bi .t span{font-size:.8rem;color:var(--muted)}
.cd{margin-top:3px;padding:0 9px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:.78rem;font-style:normal;font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:92vw;padding:10px 16px;background:var(--ink);color:var(--bg);border-radius:8px;z-index:10}
.tabs{flex-wrap:wrap}
.dfl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 12px;padding:8px 12px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;background:var(--surface);font-size:.9rem}
.dfl span{flex:1;min-width:200px}
.dir{display:flex;align-items:flex-start;gap:8px;margin:0 0 14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:.86rem;line-height:1.35;cursor:pointer}
.dir input{width:auto;flex:none;margin-top:3px}

.sg .sh .cd{margin:0}
.sg .sd{margin:2px 0 8px;color:var(--muted);font-size:.86rem}
.sg .sp{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.sg .sp>span{font-size:.85rem;color:var(--muted);margin-right:2px}
button.pl{padding:4px 11px;border:1px solid var(--c);border-radius:99px;background:color-mix(in srgb,var(--c) 10%,var(--surface));font-size:.88rem;line-height:1.35}
button.pl.nam{--c:var(--nam)}
button.pl.nu{--c:var(--nu)}
.nf h2{font-size:1.3rem;margin-bottom:2px}
.nrow{display:flex;gap:16px;align-items:flex-start;margin:12px 0}
.nimg{flex:none;display:flex;flex-direction:column;gap:8px;align-items:flex-start;width:min(240px,40%)}
.nimg input{width:100%}
.np{max-width:100%;max-height:300px;border:1px solid var(--line);border-radius:6px;object-fit:contain;background:var(--bg)}
.np[hidden]{display:none}
.person.hl{outline:4px solid var(--accent);outline-offset:-4px;background:color-mix(in srgb,var(--accent) 24%,var(--surface));animation:hlp 1s ease-in-out 4}
@keyframes hlp{0%,100%{background:color-mix(in srgb,var(--accent) 24%,var(--surface))}50%{background:var(--surface)}}
@media (prefers-reduced-motion:reduce){.person.hl{animation:none}}
.stb{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 12px}
.stb input{flex:1 1 220px;width:auto;min-width:0}
.stb select{width:auto}
.stf{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
#updm{margin:2px 0 0;color:var(--muted);font-size:.9rem}#updm:empty{display:none}
.ups{margin:12px 0 0;padding-left:1.3em;display:grid;gap:14px}
.ups textarea{min-height:150px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem}
.ntx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;font-size:.88rem;color:var(--muted)}
.ntx textarea{min-height:170px;font-size:1rem;color:var(--ink)}
@media (max-width:520px){.nrow{flex-direction:column}.nimg{width:100%}}
#dn{width:min(640px,94vw);padding:0;overflow:auto}
.nb{padding:16px 18px 18px}
.nh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.nh h2{font-size:1.3rem}
.nx{padding:2px 11px;font-size:1.25rem;line-height:1.3}
.nc{display:flex;gap:16px;align-items:flex-start;margin-bottom:14px}
.ni{flex:none;max-width:48%;max-height:62vh;object-fit:contain;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.nt{flex:1;min-width:0;margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:1.05rem;line-height:1.55}
.nc.o{justify-content:center}
.nc.o .ni{max-width:100%}
@media (max-width:520px){.nc{flex-direction:column}.ni{max-width:100%}}
@media print{
html:root:root{--bg:#fff;--surface:#fff;--ink:#000;--muted:#444;--line:#888;color-scheme:light}
body{background:#fff;color:#000;font-size:12px}
.actions,#q,.tabs,#bn,dialog{display:none!important}
.ph{display:block;margin:0 0 8px;color:#444}
.tree{overflow:visible}
.seg{display:none!important}
.person,.row,.sg{break-inside:avoid;border-color:#999}
a{color:#000}
}

const updScript=id=>`function doGet(e) {
  var folder = DriveApp.getFolderById('${id||'DÁN_MÃ_THƯ_MỤC_VÀO_ĐÂY'}');
  var files = folder.getFilesByName('gia-pha-moi-nhat.json');
  var best = null;
  while (files.hasNext()) {
    var f = files.next();
    if (!best || f.getLastUpdated() > best.getLastUpdated()) best = f;
  }
  var out = best ? best.getBlob().getDataAsString() : JSON.stringify({error: 'not found'});
  var cb = e && e.parameter && e.parameter.callback;
  if (cb && /^[A-Za-z0-9_$.]+$/.test(cb)) {
    return ContentService.createTextOutput(cb + '(' + out + ')').setMimeType(ContentService.MimeType.JAVASCRIPT);
  }
  return ContentService.createTextOutput(out).setMimeType(ContentService.MimeType.JSON);
}`;

async function getJ(u,ctl){const url=u+(u.includes('?')?'&':'?')+'_='+Date.now();
 try{const r=await fetch(url,{cache:'no-store',signal:ctl.signal});if(!r.ok)throw 0;return JSON.parse(await r.text())}
 catch(e){return await new Promise((res,rej)=>{const cb='gp_'+Date.now(),sc=document.createElement('script');let done=0;const end=f=>{if(done)return;done=1;delete window[cb];sc.remove();f()};window[cb]=d=>end(()=>res(d));sc.onload=()=>setTimeout(()=>end(()=>rej(new Error('old'))),50);sc.onerror=()=>end(()=>rej(new Error('net')));setTimeout(()=>end(()=>rej(new Error('net'))),20000);sc.src=url+'&callback='+cb;document.head.appendChild(sc)})}}
async function updCheck(manual){
 if(!VIEW||(!UU()&&!DB)||updBusy)return;
 if(navigator.onLine===false){updMsg='Chưa có mạng, đang dùng dữ liệu đã lưu trên máy.';updShow();if(manual)toast(updMsg);return}
 updBusy=true;updMsg='Đang kiểm tra dữ liệu mới...';updShow();
 const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),20000);
 try{
  let j;if(UU()){j=await getJ(upd,ctl);if(j&&j.error)throw 0}else{j=await dbPull();if(!j)throw 0}
   const u=unpack(j);if(!u.ps.length)throw 0;
  const d=new Date(),hm=pad(d.getHours())+':'+pad(d.getMinutes());
  if(u.tt&&u.tt<dataT){updMsg='Dữ liệu trên Drive cũ hơn bản đang có (có thể đang chờ đồng bộ), giữ bản hiện tại. Kiểm tra lúc '+hm+'.'}
  else{
   const before=sigOf(),oldN=hasN(notice)?JSON.stringify(notice):'';
   people=u.ps;if(u.hn)notice=u.n;if(u.hs)saints=u.sa;
   if(before!==sigOf()){
    dataT=u.tt||Date.now();
    try{localStorage.setItem(KEY,JSON.stringify(people));localStorage.setItem(KEY+'-notice',JSON.stringify(notice));localStorage.setItem(KEY+'-saints',JSON.stringify(saints));localStorage.setItem(KEY+'-t',dataT)}catch(e){bad=true}
    render();const nn=hasN(notice)?JSON.stringify(notice):'';if(nn&&nn!==oldN)showNotice();
    updMsg='Đã cập nhật dữ liệu mới lúc '+hm+'.'
   }else{if(u.tt)dataT=Math.max(dataT,u.tt);updMsg='Dữ liệu đã là bản mới nhất. Kiểm tra lúc '+hm+'.'}
  }
 }catch(e){updMsg='Chưa cập nhật được, đang dùng dữ liệu đã lưu trên máy.'+(e&&e.message==='old'?' (Cần dán đoạn mã cầu nối mới vào Google Apps Script.)':'')}
 clearTimeout(tm);updBusy=false;updAt=Date.now();updShow();if(manual)toast(updMsg)}
async function updTest(u){const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),20000);
 try{let j;try{j=await getJ(u,ctl)}catch(e){return{ok:false,why:e&&e.message==='old'?'Cầu nối đang dùng đoạn mã cũ. Hãy dán đoạn mã mới ở bước 2 vào Google Apps Script, rồi Triển khai > Quản lý bản triển khai > Sửa > Phiên bản mới.':'Không kết nối được. Kiểm tra mạng, địa chỉ đã dán và quyền truy cập "Bất kỳ ai".'}}
  if(j&&j.error)return{ok:false,why:'Cầu nối chạy được nhưng chưa thấy tệp gia-pha-moi-nhat.json trong thư mục. Hãy bấm "Sao lưu lên đám mây" ở app mẹ, chờ Drive đồng bộ rồi thử lại.'};
  let x;try{x=unpack(j)}catch(e){return{ok:false,why:'Dữ liệu nhận về không đúng định dạng gia phả.'}}
  return{ok:true,n:x.ps.length,t:x.tt}}
 catch(e){return{ok:false,why:'Không kết nối được. Kiểm tra mạng và địa chỉ đã dán.'}}finally{clearTimeout(tm)}}

 g('t').onclick=async()=>{const v=val();if(!v)return;m('Đang thử kết nối...');const r=await updTest(v);if(r.ok){const t=r.t?new Date(r.t):null;m('Kết nối được: '+r.n+' người'+(t?', dữ liệu sao lưu lúc '+pad(t.getHours())+':'+pad(t.getMinutes())+' ngày '+fmt({d:t.getDate(),m:t.getMonth()+1,y:t.getFullYear()}):'')+'.')}else m(r.why,true)};
 g('s').onclick=()=>{const v=val();if(!v)return;upd=v;try{localStorage.setItem(KEY+'-upd',upd)}catch(e){}save();m('Đã lưu. Bấm "Xuất app con" hoặc "Sao lưu lên đám mây" để app con nhận địa chỉ này.')};

 if(k==='del'){if(!a.dataset.sure){a.dataset.sure=1;a.textContent='Bấm lần nữa để xóa';return}
  people=people.filter(x=>x.id!==id);people.forEach(x=>['fatherId','motherId','spouseId'].forEach(f=>{if(x[f]===id)delete x[f]}));save();d.close();render()}
};
$('#dv').onchange=e=>{if(e.target.id!=='dv-dir')return;const d=$('#dv'),id=d.dataset.id;fp=e.target.checked?id:null;view='tree';$('#q').value='';q='';d.close();render(1)};
function openForm(pre={},id=null){const p=id?by(id):pre,d=$('#df'),v=k=>esc(p[k]);let photo=p.photo||'';
 const rel0=p.rel||'Công Giáo',known=REL.includes(rel0),cath0=isCath({rel:rel0});
 const opts=(sel)=>'<option value="">Không rõ</option>'+people.filter(x=>x.id!==id).map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(dn(x))}${x.birth?' ('+esc(x.birth)+')':''}</option>`).join('');
 d.innerHTML=`<h2>${id?'Sửa thông tin':'Thêm người'}</h2><div class="grid">
 <div class="w pr"><img id="f-img" class="av" alt="" ${photo?`src="${photo}"`:'hidden'}><input id="f-file" type="file" accept="image/*" aria-label="Chọn ảnh"><button type="button" id="f-rm">Bỏ ảnh</button><small style="flex-basis:100%;color:var(--muted)">Ảnh tự cắt theo khổ thẻ 3x4, nên chọn ảnh chụp chính diện.</small></div>
 <label class="w">Họ và tên<input id="f-name" value="${v('name')}"></label>
 <label>Giới tính<select id="f-gender"><option value="nam" ${p.gender!=='nu'?'selected':''}>Nam</option><option value="nu" ${p.gender==='nu'?'selected':''}>Nữ</option></select></label>
 <label>Nghề nghiệp<input id="f-job" value="${v('job')}"></label>
 <div class="w rg"><label>Tôn giáo<select id="f-relsel">${REL.map(r=>`<option ${r===rel0?'selected':''}>${r}</option>`).join('')}<option value="__x" ${known?'':'selected'}>Khác</option></select></label>
 <label id="f-relx-w" ${known?'hidden':''}>Tên tôn giáo<input id="f-relx" value="${known?'':esc(rel0)}"></label>
 <label id="f-saint-w" ${cath0?'':'hidden'}>Tên Thánh<input id="f-saint" value="${v('saint')}" autocomplete="off" placeholder="Gõ để chọn, ví dụ Giuse"><span class="sug" id="f-sug" hidden></span></label>
 <label class="w" id="f-sday-w" ${cath0?'':'hidden'}>Ngày lễ bổn mạng (DD/MM)<input id="f-sday" value="${v('saintDay')}" inputmode="decimal" autocomplete="off" placeholder="Tự điền khi chọn Tên Thánh"><small class="hint" id="f-shint"></small></label></div>
 <label>Ngày sinh (dương lịch)<input id="f-birth" value="${v('birth')}" placeholder="DD/MM/YYYY hoặc chỉ năm" inputmode="decimal" autocomplete="off"></label>
 <label>Ngày mất (dương lịch)<input id="f-death" value="${v('death')}" placeholder="DD/MM/YYYY, để trống nếu còn sống" inputmode="decimal" autocomplete="off"></label>
 <label class="w">Ngày giỗ âm lịch (DD/MM)<input id="f-gio" value="${v('gio')}" placeholder="Tự tính từ ngày mất. Chỉ nhập nếu bạn biết ngày âm lịch khác, ví dụ 15/07" inputmode="decimal" autocomplete="off"></label>
 <label>Nơi sinh<input id="f-place" value="${v('place')}"></label>
 <label>Quê quán<input id="f-home" value="${v('home')}"></label>
 <label>Cha<select id="f-fatherId">${opts(p.fatherId)}</select></label>
 <label>Mẹ<select id="f-motherId">${opts(p.motherId)}</select></label>
 <label class="w">Vợ/chồng<select id="f-spouseId">${opts(p.spouseId)}</select></label>
 <label class="w">Ghi chú<textarea id="f-note" style="min-height:80px;font-size:1rem">${v('note')}</textarea></label></div>
 <p class="err" id="f-err" role="alert"></p><div class="bar"><button class="pri" id="f-save">Lưu</button><button id="f-cancel">Hủy</button></div>`;
 $('#f-cancel').onclick=()=>d.close();
 const relV=()=>{const s=$('#f-relsel').value;return s==='__x'?$('#f-relx').value.trim():s};
 const catV=()=>isCath({rel:relV()});
 const closeSug=()=>{const s=$('#f-sug');if(s)s.hidden=true};
 const syncRel=()=>{$('#f-relx-w').hidden=$('#f-relsel').value!=='__x';const c=catV();$('#f-saint-w').hidden=!c;$('#f-sday-w').hidden=!c;if(!c)closeSug()};
 $('#f-relsel').onchange=()=>{syncRel();if($('#f-relsel').value==='__x')$('#f-relx').focus()};$('#f-relx').oninput=syncRel;
 let act=-1,escT=0;const sugRows=()=>[...$('#f-sug').querySelectorAll('button')];
 const showSug=()=>{const el=$('#f-sug'),l=sugList($('#f-saint').value);act=-1;if(!l.length){el.hidden=true;return}
  el.innerHTML=l.map(s=>`<button type="button" data-i="${SL().indexOf(s)}"><b>${esc(s[0])}</b>${s[2]?`<small>${esc(s[2])}</small>`:''}<i>${s[1]}</i></button>`).join('');el.hidden=false};
 const setDay=(s,auto)=>{const sd=$('#f-sday');sd.value=s;if(auto)sd.dataset.auto='1';else delete sd.dataset.auto};
 $('#f-sug').onclick=e=>{const b=e.target.closest('button');if(!b)return;const s=SL()[+b.dataset.i];$('#f-saint').value=s[0];setDay(s[1],1);$('#f-shint').textContent='';closeSug()};
 $('#f-saint').oninput=()=>{if($('#f-sday').dataset.auto)setDay('');$('#f-shint').textContent='';showSug()};
 $('#f-saint').onfocus=showSug;
 $('#f-saint').onchange=()=>{const n=norm($('#f-saint').value).trim().replace(/^thanh\s+/,'');if(!n)return;const m=SL().filter(s=>norm(s[0])===n);
  if(m.length)$('#f-saint').value=m[0][0];
  if(m.length===1&&!$('#f-sday').value.trim())setDay(m[0][1],1);
  else if(m.length>1&&!$('#f-sday').value.trim())$('#f-shint').textContent='Tên này có nhiều ngày lễ, hãy chọn một mục trong danh sách gợi ý hoặc tự nhập ngày.'};
 $('#f-saint').onkeydown=e=>{const el=$('#f-sug');if(el.hidden){if(e.key==='ArrowDown')showSug();return}
  const r=sugRows();
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();act=(act+(e.key==='ArrowDown'?1:-1)+r.length)%r.length;r.forEach((b,i)=>b.classList.toggle('on',i===act));r[act].scrollIntoView({block:'nearest'})}
  else if(e.key==='Enter'&&act>=0){e.preventDefault();r[act].click()}
  else if(e.key==='Escape'){e.preventDefault();escT=Date.now();closeSug()}else if(e.key==='Tab')closeSug()};
 $('#f-sday').addEventListener('input',()=>{delete $('#f-sday').dataset.auto});
 d.onpointerdown=e=>{if(!e.target.closest('#f-saint-w'))closeSug()};
 d.oncancel=e=>{const s=$('#f-sug');if((s&&!s.hidden)||Date.now()-escT<200){e.preventDefault();closeSug()}};
 dmask($('#f-birth'),3);dmask($('#f-death'),3);dmask($('#f-gio'),2);dmask($('#f-sday'),2);
 $('#f-file').onchange=e=>{const f=e.target.files[0];if(f)resize(f,u=>{if(u){photo=u;$('#f-img').src=u;$('#f-img').hidden=false;$('#f-err').textContent=''}else $('#f-err').textContent='Không đọc được ảnh này. Thử ảnh JPG hoặc PNG.'})};
 $('#f-rm').onclick=()=>{photo='';$('#f-img').hidden=true;$('#f-img').removeAttribute('src');$('#f-file').value=''};
 $('#f-save').onclick=()=>{const g=k=>$('#f-'+k).value.trim();
  ['birth','death','gio','sday'].forEach(k=>{const e=$('#f-'+k);if(e&&e._fin)e._fin()});
  if(!g('name')){$('#f-err').textContent='Nhập họ và tên để lưu.';$('#f-name').focus();return}
  for(const k of['birth','death'])if(g(k)&&!vd(g(k))){$('#f-err').textContent='Nhập ngày theo dạng DD/MM/YYYY (ví dụ 23/09/1993) hoặc chỉ năm (ví dụ 1950).';$('#f-'+k).focus();return}
  if(!relV()){$('#f-err').textContent='Nhập tên tôn giáo.';$('#f-relx').focus();return}
  if(catV()&&g('sday')&&!sdp(g('sday'))){$('#f-err').textContent='Nhập ngày lễ bổn mạng dạng DD/MM, ví dụ 19/03.';$('#f-sday').focus();return}
  if(g('gio')&&!sdp(g('gio'),1)){$('#f-err').textContent='Nhập ngày giỗ âm lịch dạng DD/MM, ví dụ 15/07.';$('#f-gio').focus();return}
  const o={id:id||'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)};
  ['name','gender','job','birth','death','gio','place','home','note','fatherId','motherId','spouseId'].forEach(k=>{if(g(k))o[k]=g(k)});if(photo)o.photo=photo;
  o.rel=relV();if(catV()){if(g('saint'))o.saint=g('saint');if(g('sday'))o.saintDay=g('sday')}
  const old=id?by(id).spouseId:null;
  if(id)people=people.map(x=>x.id===id?o:x);else people.push(o);
  if(old&&old!==o.spouseId){const x=by(old);if(x&&x.spouseId===o.id)delete x.spouseId}
  if(o.spouseId){const x=by(o.spouseId);if(x){if(x.spouseId&&x.spouseId!==o.id){const y=by(x.spouseId);if(y&&y.spouseId===x.id)delete y.spouseId}x.spouseId=o.id}}
  save();d.close();render();openView(o.id)};
 d.showModal();$('#f-name').focus();
}
$('#bak').onclick=()=>{const d=$('#db');
 d.innerHTML=`<h2>Sao lưu và nhập dữ liệu</h2><p class="sub">Dữ liệu được lưu trong trình duyệt này. Hãy sao chép đoạn mã bên dưới và cất vào ghi chú hoặc tệp riêng để không bị mất khi đổi máy hoặc xóa dữ liệu trình duyệt.</p><textarea id="b-t" aria-label="Dữ liệu gia phả"></textarea><p class="err" id="b-m" role="status"></p><div class="bar"><button id="b-copy" class="pri">Sao chép</button><button id="b-dl">Tải tệp sao lưu</button><button id="b-cl">Đổi thư mục đám mây</button><input id="b-file" type="file" accept=".json,application/json" aria-label="Nạp từ tệp sao lưu" style="width:auto"><button id="b-imp">Thay bằng dữ liệu đã dán</button><button id="b-x">Đóng</button></div>`;
 $('#b-t').value=JSON.stringify(pack(),null,1);
 $('#b-x').onclick=()=>d.close();
 $('#b-cl').onclick=async()=>{try{await hset(null)}catch(e){}d.close();cloud(true)};
 $('#b-dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('#b-t').value],{type:'application/json'}));a.download='gia-pha-'+fmt(today()).replace(/\//g,'-')+'.json';a.click();$('#b-m').textContent='Đã tạo tệp sao lưu, kiểm tra thư mục Tải xuống.'};
 $('#b-file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#b-t').value=r.result;$('#b-m').textContent='Đã nạp tệp. Bấm "Thay bằng dữ liệu đã dán" để áp dụng.'};r.readAsText(f)};
 $('#b-copy').onclick=async()=>{const t=$('#b-t');t.select();try{await navigator.clipboard.writeText(t.value)}catch(e){document.execCommand('copy')}$('#b-m').textContent='Đã sao chép.'};
 $('#b-imp').onclick=()=>{try{const u=unpack(JSON.parse($('#b-t').value));people=u.ps;if(u.hn)notice=u.n;if(u.hs)saints=u.sa;save();d.close();fp=null;render(1)}catch(e){$('#b-m').textContent='Dữ liệu không hợp lệ. Dán lại đúng đoạn mã đã sao lưu.'}};
 d.showModal();
};
if(VIEW){const tb=document.querySelector('.tabs');tb.prepend(tb.querySelector('[data-v="bm"]'));tb.prepend(tb.querySelector('[data-v="gio"]'))}
setInterval(()=>{if(!document.querySelector('dialog[open]'))render()},600000);
render(1);
if(VIEW)showNotice();
if(VIEW){const on=()=>UU()||DB;$('#upn').style.display=on()?'':'none';if(on())updCheck(false);if(!UU()&&DB)try{DB.doc('gp/meta').onSnapshot(()=>updCheck(false))}catch(e){}document.addEventListener('visibilitychange',()=>{if(on()&&!document.hidden&&Date.now()-updAt>300000)updCheck(false)})}
else if(DB){(async()=>{try{const j=await dbPull();if(j&&j.t>dataT&&!dirty){const u=unpack(j);people=u.ps;if(u.hn)notice=u.n;if(u.hs)saints=u.sa;dataT=j.t;fp=null;render(1)}}catch(e){}})()}
})();</script>
